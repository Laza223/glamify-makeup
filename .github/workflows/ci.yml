name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Impeccable live mode inyecta marcadores en el código mientras se itera; nunca deben llegar a main.
      - name: Sin marcadores de Impeccable live
        run: "! grep -rnE 'impeccable-(live|variant|carbonize|param|css)|localhost:8400' src"

      - name: Build
        run: pnpm build
        env:
          # Build no requiere DB real; placeholders para que next build no falle.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          DATABASE_URL: postgresql://placeholder
          DIRECT_URL: postgresql://placeholder

  # Deploy a producción (Vercel, cuenta laza223) solo al pushear a main, después
  # de que `quality` pase. Usa Vercel CLI + token (en vez de la integración
  # nativa Git de Vercel) para que el deploy quede condicionado al gate de CI,
  # no disparado directo por Vercel en cada push.
  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel Token
        id: check-token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN no configurado en GitHub Secrets; el despliegue automático es manejado directamente por la integración Git de Vercel."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check-token.outputs.skip != 'true'

      - uses: pnpm/action-setup@v4
        if: steps.check-token.outputs.skip != 'true'
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        if: steps.check-token.outputs.skip != 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.check-token.outputs.skip != 'true'
        run: pnpm add -g vercel@latest

      # Trae config/env del proyecto de Vercel (VERCEL_ORG_ID/VERCEL_PROJECT_ID
      # identifican el proyecto; los secrets de runtime — DATABASE_URL,
      # MP_ACCESS_TOKEN, CRON_SECRET, etc. — ya están cargados en Vercel y
      # PERSISTEN entre deploys, igual que antes con `wrangler secret put`).
      - name: Pull Vercel environment
        if: steps.check-token.outputs.skip != 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        if: steps.check-token.outputs.skip != 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: steps.check-token.outputs.skip != 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
